name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    # The archive step passes every object path to sh as one string, and Linux caps that string at 128 KiB.
    # Building from a short path keeps the command under the cap when the workspace path is long.
    - name: Stage godot-cpp at a short path
      shell: sh
      run: |
        rm -rf /tmp/godot-cpp
        cp -a godot-cpp /tmp/godot-cpp

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=/tmp/godot-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
